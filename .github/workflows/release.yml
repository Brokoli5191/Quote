name: Build Android Release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Create the GitHub release (tag = versionName) after building"
        type: boolean
        default: false
  push:
    tags:
      - "v*"
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  build-release:
    name: Build signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Restore signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 is missing"
            exit 1
          fi

          printf '%s' "$KEYSTORE_BASE64" \
            | base64 --decode \
            > "$RUNNER_TEMP/quote-release.jks"

      - name: Build signed release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/quote-release.jks
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Prepare release files
        id: release_files
        shell: bash
        run: |
          version="$(sed -n 's/^ *versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts)"
          if [ -z "$version" ]; then
            echo "versionName not found in app/build.gradle.kts"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk \
             "release/quote-$version.apk"
          sha256sum "release/quote-$version.apk" \
             > "release/quote-$version.apk.sha256"
          cp app/build/outputs/mapping/release/mapping.txt \
             "release/quote-$version-mapping.txt"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: quote-${{ steps.release_files.outputs.version }}
          path: release/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/') || inputs.publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release_files.outputs.version }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || steps.release_files.outputs.version }}
        run: |
          if [ "${TAG#v}" != "$VERSION" ]; then
            echo "Tag $TAG does not match versionName $VERSION"
            exit 1
          fi

          notes="release-notes.md"
          if [ -f ".github/release-notes/$VERSION.md" ]; then
            cp ".github/release-notes/$VERSION.md" "$notes"
          else
            echo "## What's New in Quote $VERSION" > "$notes"
          fi
          printf '\n**SHA-256:** `%s`\n' "$(cut -d ' ' -f 1 "release/quote-$VERSION.apk.sha256")" >> "$notes"

          gh release create "$TAG" \
            "release/quote-$VERSION.apk" \
            "release/quote-$VERSION.apk.sha256" \
            --title "$VERSION" \
            --notes-file "$notes" \
            --target "$GITHUB_SHA"
